<text x='340' y='85' font-size='18' font-weight='bold' fill='#2563eb' font-family='Helvetica, Arial, sans-serif'>z = e<tspan baseline-shift='super' font-size='12'>jωt</tspan></text><text x='340' y='107' font-size='14' fill='#1f2937' font-family='Helvetica, Arial, sans-serif'>spins counter-clockwise</text>
<text x='340' y='147' font-size='18' font-weight='bold' fill='#ea580c' font-family='Helvetica, Arial, sans-serif'>z* = e<tspan baseline-shift='super' font-size='12'>−jωt</tspan></text><text x='340' y='169' font-size='14' fill='#1f2937' font-family='Helvetica, Arial, sans-serif'>same speed, spins clockwise (mirror image)</text>
<text x='340' y='209' font-size='18' font-weight='bold' fill='#16a34a' font-family='Helvetica, Arial, sans-serif'>½(z + z*) = cos ωt</text><text x='340' y='231' font-size='14' fill='#1f2937' font-family='Helvetica, Arial, sans-serif'>the imaginary parts cancel → always real</text>
<text x='340' y='271' font-size='18' font-weight='bold' fill='#1f2937' font-family='Helvetica, Arial, sans-serif'>z · z* = |z|² = 1</text><text x='340' y='293' font-size='14' fill='#1f2937' font-family='Helvetica, Arial, sans-serif'>the two rotations undo each other</text>
<text x='340' y='40' font-size='15' fill='#9ca3af' font-family='Helvetica, Arial, sans-serif'>A conjugate is a rotation run backwards</text></svg>
